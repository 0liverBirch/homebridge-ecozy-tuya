<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarms</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6db3; --card: #fff; --bg: #f2f2f7; --ink: #111; --dim: #8a8a8e; --line: #e3e3e8; }
  @media (prefers-color-scheme: dark) { :root { --card: #2c2c2e; --bg: #141416; --ink: #f2f2f2; --line: #3a3a3c; } }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 18px 16px 28px; background: var(--bg); color: var(--ink); max-width: 560px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 2px 0 2px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 22px 0 8px; }
  #status { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .alarm-card { display: flex; align-items: center; gap: 14px; cursor: pointer; width: 100%; text-align: left; border: 0; font: inherit; color: inherit; }
  .alarm-card.off { opacity: .55; }
  .alarm-main { flex: 1; min-width: 0; }
  .alarm-name { font-size: 14px; color: var(--dim); }
  .alarm-time { font-size: 34px; font-weight: 600; line-height: 1.15; }
  .alarm-time .ampm { font-size: 17px; font-weight: 500; }
  .alarm-sub { font-size: 13.5px; color: var(--dim); margin-top: 2px; }
  .chev { color: var(--dim); font-size: 20px; }
  /* toggle switch */
  .toggle { position: relative; width: 52px; height: 32px; flex: none; }
  .toggle input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 2; }
  .toggle .track { position: absolute; inset: 0; background: #d1d1d6; border-radius: 999px; transition: background .15s; }
  .toggle .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track::after { left: 22px; }
  @media (prefers-color-scheme: dark) { .toggle .track { background: #48484a; } }
  /* edit view */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .back { background: none; border: 0; color: var(--accent); font-size: 16px; cursor: pointer; padding: 4px 0; }
  .topbar .title { font-size: 18px; font-weight: 600; flex: 1; text-align: center; }
  .timewrap { text-align: center; padding: 10px 0 2px; }
  input[type="time"] { font-size: 40px; font-weight: 600; border: 0; background: transparent; color: var(--ink); text-align: center; font-family: inherit; }
  .group { background: var(--card); border-radius: 14px; padding: 6px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .field { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field label { flex: 1; font-size: 15.5px; }
  .field .val { font-size: 15px; color: var(--dim); min-width: 44px; text-align: right; }
  .field input[type="range"] { flex: 2; accent-color: var(--accent); }
  .field select { font-size: 15.5px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0 4px; }
  .preset { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; }
  .preset.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .days { display: flex; gap: 7px; padding: 8px 0 14px; }
  .day { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13.5px; cursor: pointer; flex: 1; }
  .day.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #save { background: var(--accent); color: #fff; border: 0; border-radius: 12px; font-size: 17px; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; margin-top: 22px; }
  #save:disabled { opacity: .5; }
  #toast { text-align: center; font-size: 14px; min-height: 20px; margin-top: 12px; color: var(--dim); }
  .note { font-size: 13px; color: var(--dim); line-height: 1.45; margin-top: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="list-view">
  <h1>Alarms</h1>
  <div id="status">Loading…</div>
  <div id="alarms"></div>
  <p class="note">Tap an alarm to change its time and settings. The on/off switches work straight away.
  Alarm sound and snooze are set in the ecozy app for now; this page never touches them.</p>
</div>

<div id="edit-view" class="hidden">
  <div class="topbar">
    <button class="back" id="back">‹ Alarms</button>
    <div class="title" id="edit-title">Alarm 1</div>
    <label class="toggle"><input type="checkbox" id="edit-enabled"><span class="track"></span></label>
  </div>

  <div class="card">
    <div class="timewrap"><input type="time" id="edit-time" step="60"></div>
  </div>

  <h2>Repeat</h2>
  <div class="group">
    <div class="presets" id="presets"></div>
    <div class="days" id="edit-days"></div>
  </div>

  <h2>Ring</h2>
  <div class="group">
    <div class="field">
      <label for="edit-volume">Volume</label>
      <input type="range" id="edit-volume" min="5" max="100" step="5">
      <span class="val" id="volume-val"></span>
    </div>
  </div>

  <h2>Light</h2>
  <div class="group">
    <div class="field">
      <label for="edit-brightness">Brightness</label>
      <input type="range" id="edit-brightness" min="5" max="100" step="5">
      <span class="val" id="brightness-val"></span>
    </div>
    <div class="field">
      <label for="edit-sunrise">Light up in advance</label>
      <select id="edit-sunrise"></select>
    </div>
    <div class="field">
      <label for="edit-lightmode">Light effect</label>
      <select id="edit-lightmode"></select>
    </div>
  </div>

  <button id="save">Save</button>
  <div id="toast"></div>
</div>

<script>
'use strict';
const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const PRESETS = [
  { name: 'Once', days: [] },
  { name: 'Every day', days: DAY_NAMES },
  { name: 'Weekdays', days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] },
  { name: 'Weekend', days: ['Sat', 'Sun'] },
];
let state = null;      // last data from the clock
let editing = null;    // working copy of the alarm being edited

const $ = (id) => document.getElementById(id);

function fmtTime(a) {
  const h24 = a.hour;
  const ampm = h24 >= 12 ? 'PM' : 'AM';
  const h = h24 % 12 === 0 ? 12 : h24 % 12;
  return { text: `${String(h).padStart(2, '0')}:${String(a.minute).padStart(2, '0')}`, ampm };
}
function repeatSummary(days) {
  if (!days || !days.length) return 'Once';
  const key = [...days].sort().join(',');
  if (days.length === 7) return 'Every day';
  if (key === ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].sort().join(',')) return 'Weekdays';
  if (key === ['Sat', 'Sun'].sort().join(',')) return 'Weekend';
  return DAY_NAMES.filter((d) => days.includes(d)).join(', ');
}
// device scales <-> human percentages
const volToPct = (v) => Math.round((v / 16) * 100);
const pctToVol = (p) => Math.max(1, Math.min(16, Math.round((p / 100) * 16)));
const brightToPct = (b) => Math.round(b / 2);                    // raw 10..200
const pctToBright = (p) => Math.max(10, Math.min(200, Math.round(p * 2)));

async function api(method, body) {
  const r = await fetch('api/alarms', {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

function renderList() {
  $('status').textContent = state.connected
    ? `${state.device}`
    : `${state.device} · not connected, showing last known settings`;
  const host = $('alarms');
  host.innerHTML = '';
  for (const a of state.alarms) {
    const t = fmtTime(a);
    const card = document.createElement('div');
    card.className = 'card alarm-card' + (a.enabled ? '' : ' off');

    const main = document.createElement('div');
    main.className = 'alarm-main';
    const name = document.createElement('div');
    name.className = 'alarm-name';
    name.textContent = `Alarm ${a.index}`;
    const time = document.createElement('div');
    time.className = 'alarm-time';
    time.textContent = `${t.text} `;
    const ampm = document.createElement('span');
    ampm.className = 'ampm';
    ampm.textContent = t.ampm;
    time.appendChild(ampm);
    const sub = document.createElement('div');
    sub.className = 'alarm-sub';
    sub.textContent = repeatSummary(a.days);
    main.append(name, time, sub);

    const toggle = document.createElement('label');
    toggle.className = 'toggle';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(a.enabled);
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('change', async () => {
      const want = input.checked;
      try {
        state = await api('POST', { alarms: [{ index: a.index, enabled: want }] });
        renderList();
      } catch (err) {
        input.checked = !want;
        $('status').textContent = `Could not change Alarm ${a.index}: ${err.message}`;
      }
    });
    const track = document.createElement('span');
    track.className = 'track';
    toggle.append(input, track);

    const chev = document.createElement('div');
    chev.className = 'chev';
    chev.textContent = '›';

    card.append(main, toggle, chev);
    card.addEventListener('click', () => openEdit(a));
    host.appendChild(card);
  }
}

function sameDays(a, b) {
  return [...a].sort().join(',') === [...b].sort().join(',');
}

function renderEdit() {
  const a = editing;
  $('edit-title').textContent = `Alarm ${a.index}`;
  $('edit-enabled').checked = Boolean(a.enabled);
  $('edit-time').value = `${String(a.hour).padStart(2, '0')}:${String(a.minute).padStart(2, '0')}`;

  const presets = $('presets');
  presets.innerHTML = '';
  for (const p of PRESETS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'preset' + (sameDays(a.days, p.days) ? ' on' : '');
    b.textContent = p.name;
    b.onclick = () => { a.days = [...p.days]; renderEdit(); };
    presets.appendChild(b);
  }
  const days = $('edit-days');
  days.innerHTML = '';
  for (const d of DAY_NAMES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day' + (a.days.includes(d) ? ' on' : '');
    b.textContent = d;
    b.onclick = () => {
      const i = a.days.indexOf(d);
      if (i >= 0) a.days.splice(i, 1); else a.days.push(d);
      renderEdit();
    };
    days.appendChild(b);
  }

  const vol = $('edit-volume');
  vol.value = volToPct(a.volume);
  $('volume-val').textContent = `${vol.value}%`;
  vol.oninput = () => { $('volume-val').textContent = `${vol.value}%`; };

  const br = $('edit-brightness');
  br.value = brightToPct(a.brightness);
  $('brightness-val').textContent = `${br.value}%`;
  br.oninput = () => { $('brightness-val').textContent = `${br.value}%`; };

  const sunrise = $('edit-sunrise');
  sunrise.innerHTML = '';
  const options = [0, 5, 10, 15, 20, 30, 45, 60];
  if (!options.includes(a.sunriseMin)) options.push(a.sunriseMin);
  options.sort((x, y) => x - y);
  for (const m of options) {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = m === 0 ? 'Off' : `${m} min`;
    if (m === a.sunriseMin) o.selected = true;
    sunrise.appendChild(o);
  }

  const lm = $('edit-lightmode');
  lm.innerHTML = '';
  for (let i = 1; i <= 19; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `Effect ${i}`;
    if (i === a.lightMode) o.selected = true;
    lm.appendChild(o);
  }
}

function openEdit(alarm) {
  editing = JSON.parse(JSON.stringify(alarm));
  renderEdit();
  $('list-view').classList.add('hidden');
  $('edit-view').classList.remove('hidden');
  $('toast').textContent = '';
}

$('back').onclick = () => {
  $('edit-view').classList.add('hidden');
  $('list-view').classList.remove('hidden');
};

$('save').onclick = async () => {
  const a = editing;
  const [h, m] = ($('edit-time').value || '00:00').split(':').map(Number);
  if (Number.isFinite(h)) a.hour = h;
  if (Number.isFinite(m)) a.minute = m;
  a.enabled = $('edit-enabled').checked;
  a.volume = pctToVol(Number($('edit-volume').value));
  a.brightness = pctToBright(Number($('edit-brightness').value));
  a.sunriseMin = Number($('edit-sunrise').value);
  a.lightMode = Number($('edit-lightmode').value);

  const btn = $('save');
  btn.disabled = true;
  $('toast').textContent = 'Saving…';
  try {
    state = await api('POST', { alarms: [a] });
    $('edit-view').classList.add('hidden');
    $('list-view').classList.remove('hidden');
    renderList();
    $('status').textContent = `${state.device} · Alarm ${a.index} saved`;
  } catch (err) {
    $('toast').textContent = `Save failed: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
};

(async () => {
  try {
    state = await api('GET');
    renderList();
  } catch (err) {
    $('status').textContent = `Could not load alarms: ${err.message}`;
  }
})();
</script>
</body>
</html>
